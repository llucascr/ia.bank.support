spring.application.name=identify-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/identify_service
spring.datasource.username=postgres
spring.datasource.password=postgres

# JWT
jwt.public.key=${JWT_PUBLIC_KEY:classpath:keys/public.pem}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:keys/private.pem}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
