name: Check identify-service coverage
description: Measures Java code coverage using all tests and requires more than 70% coverage.

runs:
  using: composite
  steps:
    - name: Install XML parser if needed
      shell: bash
      run: |
        if ! command -v xmllint >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
        fi

    - name: Generate JaCoCo report
      shell: bash
      run: >-
        ./identify-service/scripts/test-auth.sh
        --batch-mode --no-transfer-progress -Pcoverage clean test jacoco:report

    - name: Require line coverage above 70 percent
      shell: bash
      run: ./identify-service/scripts/check-coverage.sh
